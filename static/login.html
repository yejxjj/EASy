<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fides — 로그인 / 회원가입</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #05080f;
  --surface: #0d1420;
  --surface2:#131e2e;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text:    #e8f4ff;
  --text2:   #8fa0b8;
  --text3:   #4a5d75;
  --accent:  #5de0d4;
  --red:     #ff5d4b;
  --mono:    'DM Mono', monospace;
  --serif:   'Instrument Serif', serif;
  --sans:    'Pretendard', sans-serif;
}

html { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
body { min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

/* ── 배경 그리드 ── */
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(90,180,220,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(90,180,220,0.05) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at 50% 30%, black 10%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 10%, transparent 70%);
}
.bg-glow {
  position: fixed; z-index: 0; pointer-events: none;
  top: -120px; left: 50%; transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(80,210,220,0.10) 0%, transparent 65%);
  filter: blur(40px);
  animation: glowPulse 6s ease-in-out infinite;
}

/* ── 네비 ── */
nav {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 48px;
  border-bottom: 1px solid var(--border);
  animation: fadeDown 0.5s ease both;
}
.logo { font-family: var(--serif); font-size: 22px; letter-spacing: -0.02em; text-decoration: none; color: var(--text); }
.logo em { color: var(--accent); font-style: italic; }
.nav-back {
  font-family: var(--mono); font-size: 11px; color: var(--text3);
  text-decoration: none; letter-spacing: 0.06em;
  display: flex; align-items: center; gap: 6px;
  transition: color 0.15s;
}
.nav-back:hover { color: var(--text2); }

/* ── 메인 레이아웃 ── */
main {
  position: relative; z-index: 5;
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 48px 24px;
}

/* ── 인증 카드 ── */
.auth-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 48px 44px;
  width: 100%; max-width: 440px;
  animation: fadeUp 0.55s 0.1s ease both;
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(93,224,212,0.4) 50%, transparent 100%);
}

.card-logo {
  font-family: var(--serif); font-size: 28px; letter-spacing: -0.02em;
  text-align: center; margin-bottom: 6px;
}
.card-logo em { color: var(--accent); font-style: italic; }
.card-sub {
  font-family: var(--mono); font-size: 10px; color: var(--text3);
  letter-spacing: 0.12em; text-transform: uppercase;
  text-align: center; margin-bottom: 36px;
}

/* ── 탭 ── */
.tab-bar {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 4px;
  margin-bottom: 32px; gap: 4px;
}
.tab-btn {
  flex: 1; padding: 9px 0; text-align: center;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  background: none; border: none; cursor: pointer; color: var(--text3);
  border-radius: 7px;
  transition: background 0.15s, color 0.15s;
}
.tab-btn:hover { color: var(--text2); }
.tab-btn.active {
  background: var(--surface); color: var(--accent);
  box-shadow: 0 1px 6px rgba(0,0,0,0.3);
}

/* ── 폼 ── */
.form-group { display: flex; flex-direction: column; gap: 12px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.field-label {
  font-family: var(--mono); font-size: 10px; color: var(--text3);
  letter-spacing: 0.1em; text-transform: uppercase;
}
.field-input {
  width: 100%; padding: 13px 16px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 9px; outline: none;
  font-family: var(--sans); font-size: 13px; color: var(--text);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field-input:focus {
  border-color: rgba(93,224,212,0.5);
  box-shadow: 0 0 0 3px rgba(93,224,212,0.08);
}
.field-input::placeholder { color: var(--text3); }

.field-hint {
  font-family: var(--mono); font-size: 10px; color: var(--text3);
  margin-top: 2px; line-height: 1.4;
}

.error-msg {
  font-family: var(--mono); font-size: 11px; color: var(--red);
  background: rgba(255,93,75,0.08); border: 1px solid rgba(255,93,75,0.2);
  border-radius: 7px; padding: 10px 14px;
  display: none; line-height: 1.5;
}
.error-msg.visible { display: block; }

.success-msg {
  font-family: var(--mono); font-size: 11px; color: var(--accent);
  background: rgba(93,224,212,0.08); border: 1px solid rgba(93,224,212,0.2);
  border-radius: 7px; padding: 10px 14px;
  display: none; line-height: 1.5;
}
.success-msg.visible { display: block; }

.submit-btn {
  margin-top: 8px; padding: 15px;
  background: linear-gradient(135deg, #2a88c4 0%, #5de0d4 100%);
  border: none; border-radius: 9px; cursor: pointer;
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  color: #05080f; letter-spacing: 0.1em; text-transform: uppercase;
  transition: filter 0.15s, transform 0.1s;
  width: 100%;
}
.submit-btn:hover { filter: brightness(1.1); }
.submit-btn:active { transform: scale(0.99); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; transform: none; }

.divider {
  display: flex; align-items: center; gap: 14px;
  margin: 24px 0 0; color: var(--text3);
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border2);
}

.switch-link {
  margin-top: 16px; text-align: center;
  font-family: var(--mono); font-size: 11px; color: var(--text3);
}
.switch-link button {
  background: none; border: none; cursor: pointer;
  color: var(--accent); font-family: var(--mono); font-size: 11px;
  text-decoration: underline; text-underline-offset: 3px;
  transition: opacity 0.15s;
}
.switch-link button:hover { opacity: 0.75; }

/* ── 보안 배지 ── */
.security-row {
  display: flex; justify-content: center; gap: 20px;
  margin-top: 28px; padding-top: 20px;
  border-top: 1px solid var(--border);
}
.sec-badge {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10px; color: var(--text3);
}
.sec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

/* ── 애니메이션 ── */
@keyframes fadeUp   { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glowPulse { 0%,100%{opacity:.7} 50%{opacity:1} }

/* ── 반응형 ── */
@media (max-width: 520px) {
  nav { padding: 20px; }
  .auth-card { padding: 36px 28px; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<!-- 네비 -->
<nav>
  <a class="logo" href="/">Fi<em>des</em></a>
  <a class="nav-back" href="/">← 홈으로</a>
</nav>

<!-- 메인 카드 -->
<main>
  <div class="auth-card">
    <div class="card-logo">Fi<em>des</em></div>
    <div class="card-sub">AI Washing Detection</div>

    <!-- 탭 버튼 -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-login"    onclick="showTab('login')">로그인</button>
      <button class="tab-btn"        id="tab-register" onclick="showTab('register')">회원가입</button>
    </div>

    <!-- ── 로그인 폼 ── -->
    <div id="form-login">
      <div class="form-group">
        <div class="form-field">
          <label class="field-label" for="l-email">이메일</label>
          <input class="field-input" id="l-email" type="email"
                 placeholder="your@email.com" autocomplete="email"/>
        </div>
        <div class="form-field">
          <label class="field-label" for="l-pw">비밀번호</label>
          <input class="field-input" id="l-pw" type="password"
                 placeholder="••••••••" autocomplete="current-password"/>
        </div>

        <div class="error-msg"   id="l-error"></div>
        <div class="success-msg" id="l-success"></div>

        <button class="submit-btn" id="l-btn" onclick="doLogin()">로그인</button>
      </div>

      <div class="switch-link">
        계정이 없으신가요?&nbsp;
        <button onclick="showTab('register')">회원가입하기</button>
      </div>
    </div>

    <!-- ── 회원가입 폼 ── -->
    <div id="form-register" style="display:none">
      <div class="form-group">
        <div class="form-field">
          <label class="field-label" for="r-email">이메일</label>
          <input class="field-input" id="r-email" type="email"
                 placeholder="your@email.com" autocomplete="email"/>
        </div>
        <div class="form-field">
          <label class="field-label" for="r-nickname">닉네임 <span style="color:var(--text3);font-size:9px">(선택)</span></label>
          <input class="field-input" id="r-nickname" type="text"
                 placeholder="홍길동" autocomplete="username"/>
        </div>
        <div class="form-field">
          <label class="field-label" for="r-pw">비밀번호</label>
          <input class="field-input" id="r-pw" type="password"
                 placeholder="••••••••" autocomplete="new-password"/>
          <div class="field-hint">6자 이상 입력해주세요</div>
        </div>

        <div class="error-msg"   id="r-error"></div>
        <div class="success-msg" id="r-success"></div>

        <button class="submit-btn" id="r-btn" onclick="doRegister()">가입하기</button>
      </div>

      <div class="switch-link">
        이미 계정이 있으신가요?&nbsp;
        <button onclick="showTab('login')">로그인하기</button>
      </div>
    </div>

    <!-- 보안 배지 -->
    <div class="security-row">
      <div class="sec-badge"><div class="sec-dot"></div>bcrypt 암호화</div>
      <div class="sec-badge"><div class="sec-dot"></div>JWT 인증</div>
      <div class="sec-badge"><div class="sec-dot"></div>30일 세션</div>
    </div>
  </div>
</main>


<script>
/* ── URL 파라미터로 탭 결정 ── */
(function () {
  const tab = new URLSearchParams(location.search).get('tab');
  if (tab === 'register') showTab('register');
})();

/* ── 탭 전환 ── */
function showTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('form-login').style.display    = isLogin ? 'block' : 'none';
  document.getElementById('form-register').style.display = isLogin ? 'none'  : 'block';
  document.getElementById('tab-login').classList.toggle('active',    isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);
  clearMsgs();
  // focus 첫 번째 input
  setTimeout(() => {
    document.getElementById(isLogin ? 'l-email' : 'r-email')?.focus();
  }, 60);
}

function clearMsgs() {
  ['l-error','l-success','r-error','r-success'].forEach(id => {
    const el = document.getElementById(id);
    el.textContent = '';
    el.className = el.className.replace(' visible','');
  });
}
function showErr(id, msg)  { const el=document.getElementById(id); el.textContent=msg; el.classList.add('visible'); }
function showOk(id, msg)   { const el=document.getElementById(id); el.textContent=msg; el.classList.add('visible'); }

/* ── 로그인 ── */
async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pw    = document.getElementById('l-pw').value;
  const btn   = document.getElementById('l-btn');

  if (!email || !pw) { showErr('l-error', '이메일과 비밀번호를 입력하세요.'); return; }
  clearMsgs();
  btn.disabled = true; btn.textContent = '로그인 중...';

  try {
    const res  = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw }),
    });
    const data = await res.json();

    if (!res.ok) { showErr('l-error', data.detail || '로그인에 실패했습니다.'); return; }

    // 저장 후 홈으로 이동
    saveUser(data);
    showOk('l-success', '로그인 성공! 홈으로 이동합니다...');
    setTimeout(() => { location.href = '/'; }, 900);

  } catch { showErr('l-error', '네트워크 오류가 발생했습니다. 다시 시도해주세요.'); }
  finally  { btn.disabled = false; btn.textContent = '로그인'; }
}

/* ── 회원가입 ── */
async function doRegister() {
  const email    = document.getElementById('r-email').value.trim();
  const nickname = document.getElementById('r-nickname').value.trim();
  const pw       = document.getElementById('r-pw').value;
  const btn      = document.getElementById('r-btn');

  if (!email || !pw) { showErr('r-error', '이메일과 비밀번호를 입력하세요.'); return; }
  if (pw.length < 6) { showErr('r-error', '비밀번호는 6자 이상이어야 합니다.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showErr('r-error', '올바른 이메일 형식을 입력하세요.'); return;
  }
  clearMsgs();
  btn.disabled = true; btn.textContent = '가입 중...';

  try {
    const res  = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw, nickname }),
    });
    const data = await res.json();

    if (!res.ok) { showErr('r-error', data.detail || '회원가입에 실패했습니다.'); return; }

    saveUser(data);
    showOk('r-success', '가입 완료! 홈으로 이동합니다...');
    setTimeout(() => { location.href = '/'; }, 900);

  } catch { showErr('r-error', '네트워크 오류가 발생했습니다. 다시 시도해주세요.'); }
  finally  { btn.disabled = false; btn.textContent = '가입하기'; }
}

/* ── 세션 저장 ── */
function saveUser(data) {
  localStorage.setItem('fides_token',    data.token);
  localStorage.setItem('fides_email',    data.email);
  localStorage.setItem('fides_nickname', data.nickname || data.email.split('@')[0]);
}

/* ── 이미 로그인된 경우 홈으로 ── */
if (localStorage.getItem('fides_token')) {
  // 홈에서 로그인 버튼 눌러서 온 게 아니면 홈으로
  if (!document.referrer.includes('/login')) {
    // 이미 토큰 있으면 그냥 홈으로 보내기
    // location.href = '/';  // 필요 시 활성화
  }
}

/* ── 엔터키 ── */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const isLogin = document.getElementById('form-login').style.display !== 'none';
  if (isLogin) doLogin(); else doRegister();
});
</script>
</body>
</html>
